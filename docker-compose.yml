version: '3.8'

services:
  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    container_name: discovery-server
    ports:
      - "8080:8080"
    networks:
      - discovery-net

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    depends_on:
      - discovery-server
    environment:
      SERVER_PORT: 8081
      DISCOVERY_SERVER_URL: http://discovery-server:8080
      DISCOVERY_SERVICE_NAME: user-service
      DISCOVERY_SERVICE_PORT: 8081
    ports:
      - "8081:8081"
    networks:
      - discovery-net

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    depends_on:
      - discovery-server
      - user-service
    environment:
      SERVER_PORT: 8082
      DISCOVERY_SERVER_URL: http://discovery-server:8080
      DISCOVERY_SERVICE_NAME: order-service
      DISCOVERY_SERVICE_PORT: 8082
    ports:
      - "8082:8082"
    networks:
      - discovery-net

networks:
  discovery-net:
    driver: bridge